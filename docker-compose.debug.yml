# docker-compose.debug.yml
# ─────────────────────────────────────────────────────────────────────────────
# Local-development override that exposes internal services on the host for
# debugging.  NEVER use this in production.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "8000:8000"

  flower:
    ports:
      - "5555:5555"
