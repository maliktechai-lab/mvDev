# DeepGuard-Image Training Configuration
# All components trained from scratch — no pretrained weights.
#
# Run with:
#   python backend/training/train_image.py \
#     --dataset_root ml/datasets/processed \
#     --epochs 50 --batch_size 32 --device cuda

experiment_name: deepguard_image_v1_scratch
description: >
  Custom 3-branch deepfake detector trained entirely from scratch.
  Branch 1 — Spatial:    Custom deep CNN (depthwise-sep + SE + residual, ~5.2M params)
  Branch 2 — Frequency:  FFT + DCT CNN (frequency artifact detection)
  Branch 3 — Attention:  Cross-attention between spatial and frequency features

# Dataset
dataset:
  root: ml/datasets/processed
  max_per_class: null           # null = use all; e.g. 5000 for quick smoke tests

# Model — no pretrained backbone
model:
  pretrained: false             # always false — this is a from-scratch model
  branch_dim: 512
  spatial_stages: 5             # stem + 5 stages in SpatialBranch
  attention_heads: 8

# Training
training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.1
  warmup_epochs: 5              # Linear LR warmup before cosine decay
  patience: 10                  # Early stopping patience (epochs without val AUC improvement)
  mixed_precision: true         # AMP (GPU only, ignored on CPU)

# Optimizer — unified LR (no backbone/head split needed for scratch model)
optimizer:
  type: AdamW
  betas: [0.9, 0.999]

# Scheduler — linear warmup → cosine decay
scheduler:
  type: cosine_with_warmup
  warmup_epochs: 5
  eta_min: 0.000001

# Loss
loss:
  main_weight: 1.0
  aux_weight: 0.3               # Per-branch auxiliary loss weight (deep supervision)

# Augmentation (training only)
augmentation:
  random_horizontal_flip: 0.5
  color_jitter: true
  gaussian_blur: 0.2
  random_erasing: 0.1
  random_rotation: 10

# Checkpointing
checkpoint:
  dir: ml/checkpoints
  canonical_name: deepguard_image.pth   # name the registry looks for
  save_every_n_epochs: 5

# Evaluation metrics
evaluation:
  threshold: 0.5
  metrics:
    - auc_roc
    - accuracy
    - f1_score
    - eer
