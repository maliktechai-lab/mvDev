worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile   on;
    keepalive_timeout 65;

    # Upload size limit — matches MAX_VIDEO_SIZE_MB + small headroom
    client_max_body_size 512M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # ── Rate-limit zones ─────────────────────────────────────────────────
    # Restrict login attempts at the proxy layer (zero FastAPI overhead,
    # effective even under high load).  The FastAPI slowapi layer provides
    # additional per-account lockout on top.
    #
    # login zone: 10 MB shared memory, 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # auth zone (register, refresh, logout): 20 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    # api zone: 60 req/min per IP for all other API traffic
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # Return JSON instead of the default HTML for 429 / 503
    limit_req_status 429;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ─────────────────────────────────────────────
        # Applied to every response from this server block.
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-Frame-Options           "DENY"                  always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';"
            always;
        # Strict-Transport-Security is commented out because this config is
        # for HTTP only.  Uncomment when TLS is terminated at this server:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Remove the server version banner
        server_tokens off;

        # ── Login endpoint (most restrictive) ────────────────────────────
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_log_level warn;

            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Other auth endpoints ─────────────────────────────────────────
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_log_level warn;

            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── All other API routes ─────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ── WebSocket support (future real-time updates) ─────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }

        # ── Heatmap images (served directly, long-cached) ────────────────
        location /heatmaps/ {
            alias /app/heatmaps/;
            expires 1d;
            add_header Cache-Control "public, immutable";
            # Security: prevent browsers from interpreting heatmap images as HTML
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── React SPA ────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host        $host;
            proxy_set_header X-Real-IP   $remote_addr;
        }
    }
}
