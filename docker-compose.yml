services:

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: deepguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # SECURITY: No ports exposed to the host.
    # PostgreSQL is only reachable on the internal Docker network.
    # Expose 5432 locally only when needed for debugging:
    #   docker-compose -f docker-compose.yml -f docker-compose.debug.yml up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deepguard_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # SECURITY: No ports exposed to the host.
    # Redis is only reachable on the internal Docker network.
    # Expose 6379 locally only when needed for debugging:
    #   docker-compose -f docker-compose.yml -f docker-compose.debug.yml up
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: deepguard_backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - ./ml/checkpoints:/app/checkpoints
      - uploads_data:/app/uploads
      - heatmaps_data:/app/heatmaps
    # SECURITY: No direct host port mapping.
    # All traffic must flow through Nginx (port 80/443).
    # The backend is reachable at http://backend:8000 within the Docker network.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # HEALTHCHECK is provided by Dockerfile.backend (HTTP ping to :8000).

  # ── Celery Worker ──────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: deepguard_celery
    restart: unless-stopped
    env_file: .env
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2 -Q video,audio,default
    volumes:
      - ./backend:/app
      - ./ml/checkpoints:/app/checkpoints
      - uploads_data:/app/uploads
      - heatmaps_data:/app/heatmaps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app inspect ping --timeout 5 2>&1 | grep -q pong || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  # ── Celery Flower (monitoring) ─────────────────────────
  # SECURITY: Flower is NOT exposed to the public internet.
  # Access it via an SSH tunnel:
  #   ssh -L 5555:localhost:5555 your-server
  # then open http://localhost:5555 in your browser.
  # Basic-auth credentials are set via FLOWER_BASIC_AUTH in .env.
  flower:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: deepguard_flower
    restart: unless-stopped
    env_file: .env
    command: >
      celery -A core.celery_app flower --port=5555
      --basic-auth=${FLOWER_BASIC_AUTH}
    expose:
      - "5555"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555/healthcheck')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── React Frontend (BLINK) ─────────────────────────────
  # SECURITY: No direct host port mapping.
  # All traffic must flow through Nginx (port 80/443).
  frontend:
    build:
      context: ./frontend-blink
      dockerfile: ../docker/Dockerfile.frontend-blink
      args:
        VITE_API_URL: /api/v1
    container_name: deepguard_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ────────────────────────────────
  # ONLY public-facing service. Terminates TLS in production.
  nginx:
    image: nginx:1.25-alpine
    container_name: deepguard_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - heatmaps_data:/app/heatmaps:ro
    ports:
      - "80:80"
      # Uncomment for HTTPS (requires TLS certs volume):
      # - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  heatmaps_data:
