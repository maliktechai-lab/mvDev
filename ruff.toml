# Ruff configuration for DeepGuard backend
# Run: ruff check backend/

[tool.ruff]
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray print statements)
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",   # assert allowed in tests
    "S311",   # random allowed (we don't use it for crypto)
    "B008",   # FastAPI Depends() in function default args is a known pattern
    "E501",   # line length managed by formatter, not linter
    "S106",   # hardcoded password literals — false positives on test fixtures
    "S105",   # hardcoded password strings — false positives on placeholder comments
]

[lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]   # relax security rules in tests
"backend/db/migrations/**/*.py" = ["E501", "UP"]  # generated code
